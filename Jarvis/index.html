<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jarvis</title>
<style>
  :root{
    --bg:#161512;
    --panel:#201f1b;
    --border:#332f27;
    --amber:#e8a33d;
    --amber-dim:#8a6528;
    --text:#f0ece1;
    --text-muted:#7a7568;
    --danger:#c15a4a;
    --success:#7a9e6e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:24px 16px 40px;
  }
  .wrap{width:100%;max-width:520px;display:flex;flex-direction:column;height:100%;}
  header{text-align:center;margin-bottom:24px;}
  h1{font-size:22px;font-weight:600;letter-spacing:0.02em;margin:0 0 6px;color:var(--amber);}
  .sub{font-size:13px;color:var(--text-muted);}

  #gate{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:80px;}
  #gate input{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:12px 14px;border-radius:8px;font-size:15px;width:260px;text-align:center;
  }
  #gate button{
    background:var(--amber);color:#1a1712;border:none;padding:12px 24px;
    border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
  }
  #gateError{color:var(--danger);font-size:13px;min-height:16px;}

  #app{display:none;flex-direction:column;flex:1;}

  #log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 4px 16px;min-height:120px;}
  .msg{
    padding:12px 16px;border-radius:12px;font-size:14.5px;line-height:1.5;
    max-width:90%;white-space:pre-wrap;
  }
  .user{align-self:flex-end;background:var(--amber-dim);color:#1a1712;font-weight:500;}
  .status{align-self:flex-start;background:var(--panel);border:1px solid var(--border);}
  .success{align-self:flex-start;background:rgba(122,158,110,0.15);border:1px solid var(--success);color:var(--success);}
  .error{align-self:flex-start;background:rgba(193,90,74,0.15);border:1px solid var(--danger);color:var(--danger);}

  .inputRow{display:flex;gap:8px;align-items:flex-end;padding-top:12px;border-top:1px solid var(--border);}
  textarea{
    flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:12px 14px;border-radius:10px;font-size:15px;resize:none;font-family:inherit;
    min-height:48px;max-height:120px;
  }
  #micBtn{
    width:48px;height:48px;flex-shrink:0;border-radius:50%;border:2px solid var(--amber);
    background:var(--panel);color:var(--amber);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  #micBtn.listening{background:var(--amber);color:#1a1712;}
  #sendBtn{
    background:var(--amber);color:#1a1712;border:none;padding:0 20px;height:48px;
    border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0;
  }
  #sendBtn:disabled{opacity:0.5;cursor:default;}
  .hint{font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">

  <div id="app" style="display:flex;">
    <header>
      <h1>Jarvis</h1>
      <div class="sub">Tell him what you need done - he'll call you back with results</div>
    </header>

    <div id="log"></div>

    <div class="inputRow">
      <button id="micBtn" title="Speak instead of typing">🎤</button>
      <textarea id="textInput" placeholder="e.g. Order a large pepperoni from Pizza Hut" rows="1"></textarea>
      <button id="sendBtn" onclick="sendRequest()">Send</button>
    </div>
    <div class="hint" id="micHint"></div>
  </div>

</div>

<script>
const FUNCTION_URL = "/.netlify/functions/jarvis-web-request";

window.addEventListener('load', () => {
  document.getElementById('textInput').focus();
  setupMic();
  const ta = document.getElementById('textInput');
  ta.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendRequest();
    }
  });
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  });
});

function setupMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('micBtn');
  if(!SR){
    micBtn.style.display = 'none';
    document.getElementById('micHint').textContent = 'Voice input needs Chrome or Safari - typing always works.';
    return;
  }
  const recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  let listening = false;

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    const ta = document.getElementById('textInput');
    ta.value = ta.value ? ta.value + ' ' + transcript : transcript;
  };
  recognition.onerror = () => { stopMicUI(); };
  recognition.onend = () => { stopMicUI(); };

  function stopMicUI(){
    listening = false;
    micBtn.classList.remove('listening');
  }

  micBtn.addEventListener('click', () => {
    if(listening){
      recognition.stop();
      return;
    }
    listening = true;
    micBtn.classList.add('listening');
    try{ recognition.start(); }catch(e){ stopMicUI(); }
  });
}

function addMessage(text, cls){
  const log = document.getElementById('log');
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function sendRequest(){
  const ta = document.getElementById('textInput');
  const text = ta.value.trim();
  if(!text) return;
  ta.value = '';
  ta.style.height = 'auto';

  addMessage(text, 'user');
  const statusMsg = addMessage('Working on it...', 'status');
  document.getElementById('sendBtn').disabled = true;

  try{
    const res = await fetch(FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();
    if(data.error){
      statusMsg.textContent = 'Error: ' + data.error;
      statusMsg.className = 'msg error';
    } else {
      statusMsg.textContent = data.confirmation || "Got it - I'll call you back when it's done.";
      statusMsg.className = 'msg success';
    }
  }catch(err){
    statusMsg.textContent = 'Connection error: ' + err.message;
    statusMsg.className = 'msg error';
  }
  document.getElementById('sendBtn').disabled = false;
}
</script>
</body>
</html>
